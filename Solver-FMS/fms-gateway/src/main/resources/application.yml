spring:
  application:
    name: fms-gateway

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

fms:
  instances:
    dir: instances-MD-CVRP-JSON
  # Engine catalogue and its metadata. Each entry feeds at once the HTTP client,
  # problem dispatching, the parameters' default values and the
  # GET /api/v1/fms/solvers endpoint. Registering a new solver only takes adding
  # its constant to the TypeSolver enum and a block here; no Java class changes.
  engines:
    random:
      url: http://random-engine:8092
      display-name: Random
      description: Assigns customers to vehicles at random while honouring capacity. Serves as the comparison baseline
      strategy: Baseline
      technology: Java 22 / Spring Boot
      version: 1.0.0
      deterministic: false
      order: 10
      parameters:
        - name: seed
          description: >-
            Random generator seed. With the same instance and the same seed the solution is
            identical. If not sent, the engine draws one and returns it in the response's seed
            field, so any run can be repeated afterwards. The upper bound is 2^48-1 because
            java.util.Random keeps 48 bits: above it two different seeds would give the same
            sequence
          type: INTEGER
          min: 0
          max: 281474976710655
    greedy:
      url: http://greedy-engine:8091
      display-name: Greedy
      description: Nearest-neighbour constructive heuristic with assignment to the closest depot
      strategy: Constructive heuristic
      technology: Java 22 / Spring Boot
      version: 1.0.0
      deterministic: true
      order: 20
      parameters: []
    genetic:
      url: http://genetic-engine:8093
      display-name: Genetic Algorithm
      description: Evolutionary metaheuristic with BCRC crossover, intra- and inter-depot mutations, Prins' optimal split and local search
      strategy: Metaheuristic
      technology: Java 22 / Spring Boot + jMetal 6.6
      version: 2.0.0
      deterministic: false
      order: 30
      parameters:
        - name: populationSize
          description: >-
            Individuals per generation. A larger population explores more distinct solutions
            at the cost of more time per generation
          type: INTEGER
          default-value: 150
          min: 10
          max: 2000
        - name: maxEvaluations
          description: >-
            Cap on objective function evaluations. It rarely kicks in: in practice the run
            ends earlier through stagnation, so raising it does not improve the cost on its own
          type: INTEGER
          default-value: 75000
          min: 1000
          max: 5000000
        - name: minGenerations
          description: >-
            Generations always run before a restart or an early stop is allowed. Prevents
            cutting short a search that has not taken off yet
          type: INTEGER
          default-value: 100
          min: 1
          max: 100000
        - name: crossoverProbability
          description: >-
            Probability of crossing each selected pair with BCRC, which reinserts the other
            parent's customers in their best position. Lowering it keeps more parents intact
          type: DECIMAL
          default-value: 0.9
          min: 0
          max: 1
        - name: intraDepotMutationProbability
          description: >-
            Probability of reordering customers within the same depot. Refines already
            assigned routes without changing the distribution among depots
          type: DECIMAL
          default-value: 0.2
          min: 0
          max: 1
        - name: interDepotMutationProbability
          description: >-
            Probability of moving border customers to another depot. It is the only operator
            that changes the distribution among depots, on which quality depends in instances
            with nearby depots
          type: DECIMAL
          default-value: 0.3
          min: 0
          max: 1
        - name: elitismCount
          description: >-
            Best distinct individuals that pass intact to the next generation. Protects against
            regression; raising it too much reduces diversity
          type: INTEGER
          default-value: 5
          min: 0
          max: 100
        - name: tournamentSize
          description: >-
            Individuals competing in each selection. A larger tournament means more selective
            pressure and faster convergence, with more risk of a local optimum
          type: INTEGER
          default-value: 3
          min: 2
          max: 20
        - name: localSearchFrequency
          description: >-
            Every how many generations 2-opt and relocate are applied to the best individuals.
            A lower value intensifies the search and makes each generation more expensive
          type: INTEGER
          default-value: 10
          min: 1
          max: 1000
        - name: interDepotFrequency
          description: >-
            Every how many generations the inter-depot mutation is applied to a sample of the
            offspring
          type: INTEGER
          default-value: 5
          min: 1
          max: 1000
        - name: restartStagnantGenerations
          description: >-
            Generations without improvement that trigger a population restart keeping the best
            individual. Together with maxRestarts, it is what really ends the run
          type: INTEGER
          default-value: 20
          min: 1
          max: 10000
        - name: maxRestarts
          description: >-
            Population restarts allowed before stopping. It is the parameter with the most room
            to improve the cost, at the expense of a longer run
          type: INTEGER
          default-value: 3
          min: 0
          max: 100
        - name: heuristicSeedRatio
          description: >-
            Fraction of the initial population built with randomised nearest neighbour; the rest
            is generated at random. Starts from better solutions at the expense of diversity
          type: DECIMAL
          default-value: 0.2
          min: 0
          max: 1
        - name: seed
          description: >-
            Random generator seed. With the same instance, the same parameters and the same seed
            the solution is identical. If not sent, the engine draws one and returns it in the
            response's seed field, so any run can be repeated afterwards. The upper bound is
            2^48-1 because java.util.Random keeps 48 bits: above it two different seeds would
            give the same sequence
          type: INTEGER
          min: 0
          max: 281474976710655

    annealing:
      url: http://annealing-engine:8094
      display-name: Simulated Annealing
      description: Single-solution metaheuristic with the Metropolis criterion, intra- and inter-depot neighbourhoods, Prins' optimal split and periodic local search. Stops on a time budget and returns the anytime curve
      strategy: Metaheuristic
      technology: Java 22 / Spring Boot + jMetal 6.6
      version: 1.0.0
      deterministic: false
      order: 40
      parameters:
        - name: timeLimitMs
          description: >-
            Time budget in milliseconds. It is the main stopping criterion: the engine uses all
            of it, reheating as many times as needed, and returns the best feasible solution
            seen. The auxiliary phases may overrun it by a few tenths of a second
          type: INTEGER
          default-value: 5000
          min: 100
          max: 300000
        - name: maxLevels
          description: >-
            Cap on temperature levels; 0 means only time rules. Fixing it is what makes a seeded
            run reproducible, because with time-based stopping the number of moves depends on
            the machine load
          type: INTEGER
          default-value: 0
          min: 0
          max: 1000000
        - name: calibrationQuantile
          description: >-
            Which quantile of the worsenings sampled at start-up is taken as a "small
            worsening" to calibrate the temperature. It is the parameter that changes the
            result the most: from a local optimum almost every random move worsens a lot, and
            calibrating with the median leaves the search too hot all the time
          type: DECIMAL
          default-value: 0.05
          min: 0.01
          max: 0.5
        - name: initialAcceptanceRate
          description: >-
            Probability with which that small worsening is accepted at start-up. The initial
            temperature derives from it, so it adapts to the scale of each instance
          type: DECIMAL
          default-value: 0.4
          min: 0.01
          max: 0.99
        - name: finalAcceptanceRate
          description: >-
            Probability of accepting that same worsening below which the system is considered
            cold and is reheated to half the initial temperature from the best known solution.
            Together with coolingRate it sets how many levels a cycle lasts
          type: DECIMAL
          default-value: 0.001
          min: 0.000001
          max: 0.5
        - name: coolingRate
          description: >-
            Geometric cooling factor per level. Closer to 1 cools more slowly: longer cycles and
            fewer cycles per budget
          type: DECIMAL
          default-value: 0.96
          min: 0.5
          max: 0.9999
        - name: movesPerTemperatureFactor
          description: >-
            Moves per level and per customer: a level is this value times the number of
            customers. Proportional to the size so that the equilibrium at each temperature
            does not depend on the instance
          type: INTEGER
          default-value: 12
          min: 1
          max: 1000
        - name: interDepotMoveProbability
          description: >-
            Fraction of moves that change a customer's depot (relocation or swap). They are the
            only ones that alter the distribution among depots, on which quality depends in
            instances with nearby depots
          type: DECIMAL
          default-value: 0.25
          min: 0
          max: 1
        - name: depotCandidateRatio
          description: >-
            How much farther than the nearest depot a destination depot may be for it to be
            proposed. Moving a customer to the other end of the map is accepted by no criterion
            and only wastes iterations
          type: DECIMAL
          default-value: 1.3
          min: 1
          max: 100
        - name: localSearchFrequency
          description: >-
            Every how many levels route-level 2-opt and relocate are applied to the current
            solution. With 0 it is applied only in the final polish and the engine is pure
            annealing: it is the ablation that separates what Metropolis contributes from what
            local search contributes
          type: INTEGER
          default-value: 8
          min: 0
          max: 10000
        - name: rebalanceFrequency
          description: >-
            Every how many levels rebalancing between depots (fleet repair and improvement)
            runs, besides at start-up and at the end. With 0, only at those two moments
          type: INTEGER
          default-value: 20
          min: 0
          max: 10000
        - name: seed
          description: >-
            Random generator seed. With the same instance, the same parameters, the same seed
            and a fixed maxLevels the solution is identical; with time-based stopping it is
            not, because the number of moves depends on the machine. If not sent, the engine
            draws one and returns it in the response's seed field. The upper bound is 2^48-1
            because java.util.Random keeps 48 bits
          type: INTEGER
          min: 0
          max: 281474976710655

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui/index.html
