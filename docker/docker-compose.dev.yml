name: Delivera

services:
  delivera-postgres:
    image: postgres:16
    container_name: delivera_postgres
    restart: unless-stopped
    env_file:
      - env/.env.db.delivera
      - env/.env.dev

    environment:
      POSTGRES_DB: ${DATABASE_DELIVERA_NAME}
      POSTGRES_USER: ${DATABASE_DELIVERA_USER}
      POSTGRES_PASSWORD: ${DATABASE_DELIVERA_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - delivera_pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: [
          "CMD-SHELL",
          "pg_isready -U ${DATABASE_DELIVERA_USER} -d ${DATABASE_DELIVERA_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: postgres -c 'max_connections=200'
    
  auth-postgres:
    image: postgres:16
    container_name: delivera_auth_postgres
    restart: unless-stopped
    env_file:
      - env/.env.db.auth
      - env/.env.dev
    environment:
      POSTGRES_DB: ${DATABASE_AUTH_NAME}
      POSTGRES_USER: ${DATABASE_AUTH_USER}
      POSTGRES_PASSWORD: ${DATABASE_AUTH_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - delivera_auth_pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${DATABASE_AUTH_USER} -d ${DATABASE_AUTH_NAME}"
      ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: postgres -c 'max_connections=200'

  data-postgres:
    image: postgres:16
    container_name: delivera_data_postgres
    restart: unless-stopped
    env_file:
      - env/.env.db.data
      - env/.env.dev
    environment:
      POSTGRES_DB: ${DATABASE_DATA_NAME}
      POSTGRES_USER: ${DATABASE_DATA_USER}
      POSTGRES_PASSWORD: ${DATABASE_DATA_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - delivera_data_pg_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U ${DATABASE_DATA_USER} -d ${DATABASE_DATA_NAME}"
      ]
      interval: 5s
      timeout: 5s
      retries: 5
    command: postgres -c 'max_connections=200'

  auth-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.auth

    container_name: auth-service

    restart: unless-stopped

    env_file:
      - env/.env.certs
      - env/.env.db.auth
      - env/.env.jwt
      - env/.env.dev
      

    ports:
      - "9090:9090"
      - "9091:9091"

    expose:
      - "9091"
      - "9090"

    volumes:
      - ./keys:/app/keys:ro
      - ./certs/auth-service:/app/certs:ro
  
  data-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.data

    container_name: data-service

    restart: unless-stopped

    env_file:
      - env/.env.certs
      - env/.env.db.data
      - env/.env.space
      - env/.env.dev

    ports:
      - "9092:9092"
      - "9093:9093"

    expose:
      - "9092"
      - "9093"

    volumes:
      - ./certs/data-service:/app/certs:ro
  
  delivera-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.delivera

    container_name: delivera-service

    restart: unless-stopped

    env_file:
      - env/.env.certs
      - env/.env.db.delivera
      - env/.env.space
      - env/.env.dev

    ports:
      - "8080:8080"
      - "8081:8081"

    expose:
      - "8080"
      - "8081"

    volumes:
      - ./certs/delivera-service:/app/certs:ro
    
    depends_on:
      - data-service
      - auth-service
    
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile

    container_name: frontend

    restart: unless-stopped

    ports:
      - "3000:80"
    
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  delivera_pg_data_dev:
  delivera_auth_pg_data_dev:
  delivera_data_pg_data_dev:

