ogging:
  level:
    com.delivera: INFO
    org.springframework.web: WARN

spring:
  datasource:
    url: ${DATABASE_DATA_URL}
    username: ${DATABASE_DATA_USER}
    password: ${DATABASE_DATA_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoint:
    health:
      show-details: never

delivera:
  jwt:
    jwks-uri: ${JWKS_HOSTS}${AUTH_SERVICE_BASE_PATH}/.well-known/jwks.json
  client: 
    service-name: data-service
    internal-hosts: 
      - delivera-service
      - auth-service
    
    service-hosts:
      delivera-service: ${DELIVERA_SERVICE_HOSTS}
      auth-service: ${AUTH_SERVICE_BASE_PATH}
    
    
    service-base-paths:
      delivera-service: ${DELIVERA_SERVICE_BASE_PATH}
      auth-service: ${DATA_SERVICE_BASE_PATH}

    internal-auth:
      enabled: true
      filter-enabled: true
      header-name: X-Internal-Key
      service-header-name: X-Service-Name
  
  security:
    default-deny: false
    services:
      auth-service: 
        api-internal-key: ${AUTH_INTERNAL_KEY}
        allowed-paths:
      delivera-service: 
        api-internal-key: ${DELIVERA_INTERNAL_KEY}
        allowed-paths: 
          - /internal/units/seed/organizations/*/companies/*
          - /internal/units/*/seed/assign
          - /internal/vehicles/seed/companies/*
          - /internal/settings/seed
          - /internal/orders/B2C
          - /internal/orders/seed
          - /internal/orders/*/seed/events
          - /internal/settings
          - /internal/settings/*
          - /internal/settings/organization/*
          - /internal/units/unassign/*
          - /internal/admin/data-service/*
      data-service: 
        api-internal-key: ${DATA_INTERNAL_KEY}
        allowed-paths: 


  mtls:
    enabled: true
    key-store: ${DATA_KEY_STORE}
    key-store-password: ${DATA_KEYSTORE_PASSWORD}
    key-store-type: ${DATA_KEY_STORE_TYPE}
    trust-store: ${DATA_TRUST_STORE}
    trust-store-password: ${DATA_TRUSTSTORE_PASSWORD}
    trust-store-type: ${DATA_TRUST_STORE_TYPE}
    server:
      enabled: ${mTLS_DATA_enabled}
      port: ${mTLS_DATA_PORT}

      key-store: ${delivera.mtls.key-store}
      key-store-password: ${delivera.mtls.key-store-password}
      key-store-type: ${delivera.mtls.key-store-type}

      trust-store: ${delivera.mtls.trust-store}
      trust-store-password: ${delivera.mtls.trust-store-password}
      trust-store-type: ${delivera.mtls.trust-store-type}

      use-temp-file: false
server:
  ssl:
    enabled: ${ssl_Data_enabled}
    key-store: ${delivera.mtls.key-store}
    key-store-password: ${delivera.mtls.key-store-password}
    key-store-type: ${delivera.mtls.key-store-type}
    client-auth: none

space:
  client:
    url: ${SPACE_URL}
    api-key: ${DATA_SPACE_API_KEY}
    timeout: ${SPACE_TIMEOUT:10000}



app:
  space:
    service: ${SPACE_SERVICE}
  tracking-url-base: ${TRACKING_URL_BASE:https://delivera.app/track/}
  gateway: 
    enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:noreply@delivera.app}
  frontend-url: ${FRONTEND-URL}
  contact-email: ${CONTACT-EMAIL}
  fms:
    routing:
      base-url: ${FMS_ROUTING_URL:http://localhost:8082}






