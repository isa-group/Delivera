spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/delivera_auth_dev
    username: delivera_auth_user
    password: delivera_auth_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

app:
  jwt:
    # in miliseconds
    expiration: 900000
    issuer: ${JWT_ISSUER:delivera-auth-service}
    audience: ${JWT_AUDIENCE:delivera-api}
    rotation:
      enabled: true
      period: MONTHLY
    keys:
      key-2026-06:
        private-key: keys/private_key_2026_06.pem
        public-key: keys/public_key_2026_06.pem
      key-2026-07:
        private-key: keys/private_key_2026_07.pem
        public-key: keys/public_key_2026_07.pem
    active-key-id: ${JWT_ACTIVE_KEY:key-2026-06}
  cors:
    allowed-origins: http://localhost:3000
  mail:
    enabled: false
    from: noreply@delivera.app
  frontend-url: http://localhost:3000
  contact-email: contact@delivera.com
  auth:
    rate-limit:
      max-attempts: 5
      window-ms: 60000
  internal:
    api-key: ${AUTH_INTERNAL_API_KEY:dev-internal-key}