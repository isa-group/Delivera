spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/delivera_auth_dev
    username: delivera_auth_user
    password: delivera_auth_pass

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

delivera:
  client: 
    service-name: auth-service
    internal-hosts: 
      - delivera-service
    
    service-hosts:
      delivera-service: https://localhost:8081
    
    
    service-base-paths:
      delivera-service: /api/v2


    internal-auth:
      enabled: true
      filter-enabled: true
      header-name: X-Internal-Key
      service-header-name: X-Service-Name
  
  security:
    default-deny: false
    services:
      auth-service: 
        api-internal-key: auth-internal-key
        allowed-paths:
      delivera-service: 
        api-internal-key: delivera-internal-key
        allowed-paths: 
          - /internal/auth/register
          - /internal/auth/user/**
          - /internal/auth/username
          - /internal/auth/seed/register
          - /internal/auth/seed/register


  mtls:
    enabled: true
    key-store: ${AUTH_KEY_STORE:classpath:certs/auth-keystore.p12}
    key-store-password: ${AUTH_KEYSTORE_PASSWORD:delivera_auth_password}
    key-store-type: ${AUTH_KEY_STORE_TYPE:PKCS12}
    trust-store: ${AUTH_TRUST_STORE:classpath:certs/auth-truststore.p12}
    trust-store-password: ${AUTH_TRUSTSTORE_PASSWORD:delivera_auth_password}
    trust-store-type: ${AUTH_TRUST_STORE_TYPE:PKCS12}
    server:
      enabled: true
      port: 9091

      key-store: ${delivera.mtls.key-store}
      key-store-password: ${delivera.mtls.key-store-password}
      key-store-type: ${delivera.mtls.key-store-type}

      trust-store: ${delivera.mtls.trust-store}
      trust-store-password: ${delivera.mtls.trust-store-password}
      trust-store-type: ${delivera.mtls.trust-store-type}

      use-temp-file: false
server:
  ssl:
    enabled: false
    key-store: ${delivera.mtls.key-store}
    key-store-password: ${delivera.mtls.key-store-password}
    key-store-type: ${delivera.mtls.key-store-type}
    client-auth: none


app:
  gateway: 
    enabled: false
  
  refresh-token:
    daysToRefresh: 1
    maxDaysToRefresh: 2
    periodicDeletionMs: 3600000
    secure: false
    domain: localhost
    path: "/api/v2/"

  jwt:
    # in miliseconds
    expiration: 600000
    issuer: ${JWT_ISSUER:delivera-auth-service}
    audience: ${JWT_AUDIENCE:delivera-api}
    rotation:
      enabled: true
      period: MONTHLY
    keys:
      key-2026-06:
        private-key: keys/private_key_2026_06.pem
        public-key: keys/public_key_2026_06.pem
      key-2026-07:
        private-key: keys/private_key_2026_07.pem
        public-key: keys/public_key_2026_07.pem
    active-key-id: ${JWT_ACTIVE_KEY:key-2026-06}
  cors:
    allowed-origins: http://localhost:3000
  mail:
    enabled: false
    from: noreply@delivera.app
  frontend-url: http://localhost:3000
  contact-email: contact@delivera.com
  auth:
    rate-limit:
      rules:
        IP:
          max-attempts: 100
          window-ms: 60000
        USER_IP:
          max-attempts: 10
          window-ms: 60000
        FAIL_USER:
          max-attempts: 5
          window-ms: 60000
        FAIL_IP:
          max-attempts: 20
          window-ms: 60000
        USER:
          max-attempts: 50
          window-ms: 60000





